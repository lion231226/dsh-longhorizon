# Submission entry for the awesome-dsh-plugin community list.
#
# This file is the exact payload for `data/plugins/lion231226__dsh-longhorizon.yml`
# in https://github.com/awesome-dsh-plugin/awesome-dsh-plugin (one file per
# plugin, one `dsh.bundle`-declaring repo per entry). It is kept here so the
# entry text stays reviewable next to the code it describes — every claim in
# `description` is checked against this repository before the PR is merged.
#
# Requirements already met:
#   - package.json declares dsh.bundle.patch (the most common rejection reason
#     is declaring only dsh.client)
#   - repository is public, MIT, and carries the `dsh-plugin` topic
#   - install path exists as a GitHub Release tarball
#   - repository is at least 1 day old (created 2026-10-09T12:46:20Z)
#
# Note for the reviewer: the repository name matches the upstream project name
# only because the loop design is credited to it. This is NOT a fork of
# AMAP-ML/LongHorizon-Harness; README.md has a "Why this exists" section
# describing exactly which design was ported and why the upstream tool cannot
# run on Windows at all.

url: https://github.com/lion231226/dsh-longhorizon
name: lion231226/dsh-longhorizon
category: workflow
tarball: https://github.com/lion231226/dsh-longhorizon/releases/download/v0.2.1/dsh-longhorizon.tgz
description:
  en: 'Verified-progress ledger: three tools record a claimed step as progress only after an independent subagent with a fresh context confirms it against the workspace. Files are fingerprinted before and after each verification, so a verifier that changed anything has its verdict voided and the round cannot become progress.'
  zh: '已验证进度账本：三个工具只在「带全新上下文的独立子代理」对着工作区核实之后，才把某一步声明记为进度。每次验证前后做文件指纹比对，改动过工作区的验证者其裁决一律作废，该轮不得成为进度。'
